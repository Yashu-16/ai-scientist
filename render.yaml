services:
  - type: web
    name: ai-scientist-api
    runtime: python
    pythonVersion: "3.11.0"
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: PUBMED_EMAIL
        sync: false
      - key: ROWAN_API_KEY
        sync: false
    healthCheckPath: /health
